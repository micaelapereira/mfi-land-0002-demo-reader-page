<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-src https://calameo.com https://*.calameo.com; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="pulse-reader-pages/assets/airzoon-pin-mark.png">
<title>airZoon Pulse — MadinMag demo</title>
<style>
  :root{
    --color-primary: #E0401C;
    --surface-0: #F4F4F5; --surface-2: #FFFFFF; --border: #E8E8EA;
    --text-primary: #18181B; --text-secondary: #52525B; --text-muted: #71717A;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; background: var(--surface-0); color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .page-header{ display:flex; align-items:center; padding: 28px 40px 0; max-width: 720px; margin:0 auto; }
  .brand-logo{ height:64px; width:auto; display:block; }
  main{ max-width: 720px; margin: 0 auto; padding: 32px 24px 96px; }
  h1{ font-size: clamp(24px, 3vw, 30px); font-weight:700; margin:0 0 10px; }
  main > p{ font-size:14.5px; color: var(--text-secondary); line-height:1.6; margin:0 0 32px; }
  .list{ display:flex; flex-direction:column; gap:12px; }
  .item{
    display:flex; flex-direction:column; gap:4px;
    background: var(--surface-2); border:1px solid var(--border); border-radius:6px;
    padding: 18px 20px; text-decoration:none;
  }
  .item:hover{ border-color: var(--color-primary); }
  .item h2{ font-size:15.5px; font-weight:600; margin:0; color: var(--text-primary); }
  .item p{ font-size:13px; color: var(--text-secondary); margin:0; }
  .tag{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color: var(--text-muted); }
</style>
</head>
<body>
  <header class="page-header">
    <img class="brand-logo" src="pulse-reader-pages/assets/airzoon-logo.png" alt="airZoon">
  </header>
  <main>
    <h1>Pulse — MadinMag demo</h1>
    <p>Demo landing for EWAG: read the magazine in the page, sign up for new issues and events.</p>

    <div class="list">
      <a class="item" href="pulse-reader-pages/index.html">
        <span class="tag">MFI-LAND-0002</span>
        <h2>Reader Page</h2>
        <p>Magazine reader plus sign-up. Splash page ad, options A and B.</p>
      </a>
    </div>
  </main>
</body>
</html>
